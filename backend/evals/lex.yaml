  - id: triage_ack_deferred_4d_variable_and_sandbox
    name: "Supplier ack promising details after 4 days extracts details_promised_days=4 and uses sandbox calc"
    task: email_triage
    tags: [triage, logistics, deferral, tools, sandbox, phase3]
    input:
      sender_persona: sup3
      sender_name: Deccan Electro-Spares
      subject: "Re: PO-1037 — Confirmed (Dispatch details in 4 days)"
      body: "Confirmed PO-1037 for 15 units at Rs 780/unit (ETA 2026-10-14). Due to ERP migration, we can only share BlueDart tracking and dispatch details after 4 days (by 2026-10-05)."
      has_pdf_attachment: false
      current_date: "2026-10-01"
      part_snapshot:
        sku: RLY-901
        on_hand_stock: 150
        daily_burn_ewma: 6.25
        days_to_stockout: 24.0
      open_pos:
        - po_number: PO-1037
          part_sku: RLY-901
          part_name: PLC Safety Relay Module 24V
          qty: 15
          unit_price: 780.0
          status: SENT_AWAITING_ACK
          quoted_lead_time_days: 14
    mock_response:
      mock_tool_calls:
        - tool: get_po_details
          args:
            po_number_or_id: PO-1037
        - tool: get_part_snapshot
          args:
            sku_or_part_id: RLY-901
        - tool: run_sandbox_calc
          args:
            python_script: "result = {'safe': days_to_stockout > (wait_days + 2), 'margin_days': round(days_to_stockout - wait_days, 2)}"
            variables:
              days_to_stockout: 24.0
              wait_days: 4
      matched_po_number: PO-1037
      intent: ACKNOWLEDGED
      confidence: 0.96
      proposed_eta_date: "2026-10-14"
      carrier_name: "BlueDart"
      details_promised_later: true
      details_promised_days: 4
      details_promised_by_date: "2026-10-05"
      summary_for_manager: "Deccan Electro-Spares confirmed PO-1037 (ETA 2026-10-14) and will send BlueDart dispatch details after 4 days (2026-10-05); 24.0d runway safely covers the 4-day wait."
      suggested_action: "Schedule a 4-day Lex reminder for 2026-10-05 without sending a premature follow-up today."
      reasoning: "Verified via sandbox calc that 24.0d runway safely exceeds the 4-day deferral window (20.0d margin)."
    expect:
      intent: ACKNOWLEDGED
      matched_po_number: PO-1037
      details_promised_later: true
      details_promised_days: 4
      details_promised_by_date: "2026-10-05"
      tool_calls.length:
        min: 3
      tool_names:
        contains_all: ["get_po_details", "get_part_snapshot", "run_sandbox_calc"]
      min_confidence: 0.85

